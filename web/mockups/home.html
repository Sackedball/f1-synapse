<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>F1 Synapse — Home</title>
  <link rel="stylesheet" href="css/design-tokens.css">
  <style>
    body { overflow: auto; display: flex; align-items: center; justify-content: center; height: 100vh; }

    .home-container {
      width: 440px;
      position: relative;
    }
    .hero-brand {
      text-align: center;
      margin-bottom: 40px;
    }
    .hero-brand h1 {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 42px;
      letter-spacing: 6px;
    }
    .hero-brand h1 .f1 { color: var(--accent); }
    .hero-brand .sub {
      font-size: 12px;
      color: var(--text-3);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .hero-brand .red-line {
      width: 60px; height: 3px;
      background: var(--accent);
      margin: 16px auto 0;
      border-radius: var(--r-pill);
    }

    .load-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 28px;
      position: relative;
      overflow: hidden;
    }
    .load-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent 70%);
    }
    .load-card h2 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-3);
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 0.5px;
      margin-bottom: 5px;
      font-weight: 600;
    }
    .field select, .field input {
      width: 100%;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      color: var(--text-1);
      font-family: var(--font-sans);
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
      transition: border 0.12s;
    }
    .field select:focus, .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .session-type-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }
    .session-type-btn {
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      color: var(--text-2);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      padding: 10px 0;
      text-align: center;
      cursor: pointer;
      transition: all 0.12s;
    }
    .session-type-btn:hover { background: var(--surface-4); border-color: var(--border-strong); }
    .session-type-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .load-btn {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: var(--r-md);
      color: #fff;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      padding: 14px 0;
      cursor: pointer;
      transition: background 0.12s;
    }
    .load-btn:hover { background: var(--accent-hover); }

    .cache-section {
      margin-top: 24px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 16px 20px;
    }
    .cache-section h3 {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-3);
      margin-bottom: 10px;
    }
    .cache-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .cache-row:last-child { border-bottom: none; }
    .cache-name {
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .cache-status {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: var(--r-pill);
    }
    .cache-status.ready { background: rgba(0,210,106,0.12); color: var(--success); border: 1px solid rgba(0,210,106,0.2); }
    .cache-status.missing { background: rgba(255,255,255,0.04); color: var(--text-disabled); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="home-container">

    <div class="hero-brand">
      <h1><span class="f1">F1</span> SYNAPSE</h1>
      <div class="sub">Race Telemetry Replay Engine</div>
      <div class="red-line"></div>
    </div>

    <div class="load-card">
      <h2>Load Session</h2>

      <div class="field">
        <label>Season</label>
        <select>
          <option>2024</option>
          <option>2023</option>
          <option>2022</option>
        </select>
      </div>

      <div class="field">
        <label>Round</label>
        <select>
          <option>4 — Japanese Grand Prix (Suzuka)</option>
          <option>1 — Bahrain Grand Prix</option>
          <option>2 — Saudi Arabian Grand Prix</option>
          <option>3 — Australian Grand Prix</option>
        </select>
      </div>

      <div>
        <label style="display:block;font-size:11px;color:var(--text-3);margin-bottom:6px;font-weight:600;">Session Type</label>
        <div class="session-type-group">
          <div class="session-type-btn active">RACE</div>
          <div class="session-type-btn">QUALI</div>
          <div class="session-type-btn">SPRINT</div>
        </div>
      </div>

      <button class="load-btn">LOAD & REPLAY ▶</button>
    </div>

    <div class="cache-section">
      <h3>CACHED SESSIONS</h3>
      <div class="cache-row">
        <span class="cache-name">2024 R4 Suzuka — Race</span>
        <span class="cache-status ready">READY</span>
      </div>
      <div class="cache-row">
        <span class="cache-name">2024 R4 Suzuka — Quali</span>
        <span class="cache-status ready">READY</span>
      </div>
      <div class="cache-row">
        <span class="cache-name">2024 R3 Australia — Race</span>
        <span class="cache-status missing">NOT CACHED</span>
      </div>
    </div>

  </div>
</body>
</html>
