<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" role="img" aria-labelledby="t d"><title id="t">How F1 Synapse works</title><desc id="d">Five stages: ingest FastF1 timing feeds with per-driver extraction in a 4-process pool; resample every channel onto one 25 Hz clock and snap positions to the track centerline; predict with a Bayesian tyre model, a LightGBM overtake model and an XGBoost pit-window model; stream F1SC binary chunks of 60 seconds through FastAPI; render with a zero-allocation sampler, a PixiJS v8 track canvas and uPlot and Dockview panels.</desc><style>
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .s{font-family:'Titillium Web','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.prog{transform-box:fill-box;transform-origin:0 50%;animation:prog 8.0s linear infinite}@keyframes prog{0.00%{transform:scaleX(0.0000)}7.00%{transform:scaleX(0.0000)}20.00%{transform:scaleX(0.2500)}27.00%{transform:scaleX(0.2500)}40.00%{transform:scaleX(0.5000)}47.00%{transform:scaleX(0.5000)}60.00%{transform:scaleX(0.7500)}67.00%{transform:scaleX(0.7500)}80.00%{transform:scaleX(1.0000)}87.00%{transform:scaleX(1.0000)}96%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}.n0{animation:n0 8.0s linear infinite}@keyframes n0{0%,0.00%{fill:#15151e;stroke:#444458}0.50%,96%{fill:#e10600;stroke:#e10600}100%{fill:#15151e;stroke:#444458}}.n1{animation:n1 8.0s linear infinite}@keyframes n1{0%,19.99%{fill:#15151e;stroke:#444458}20.50%,96%{fill:#e10600;stroke:#e10600}100%{fill:#15151e;stroke:#444458}}.n2{animation:n2 8.0s linear infinite}@keyframes n2{0%,39.99%{fill:#15151e;stroke:#444458}40.50%,96%{fill:#e10600;stroke:#e10600}100%{fill:#15151e;stroke:#444458}}.n3{animation:n3 8.0s linear infinite}@keyframes n3{0%,59.99%{fill:#15151e;stroke:#444458}60.50%,96%{fill:#e10600;stroke:#e10600}100%{fill:#15151e;stroke:#444458}}.n4{animation:n4 8.0s linear infinite}@keyframes n4{0%,79.99%{fill:#15151e;stroke:#444458}80.50%,96%{fill:#e10600;stroke:#e10600}100%{fill:#15151e;stroke:#444458}}.pk{animation:pk 8.0s cubic-bezier(.6,0,.3,1) infinite}@keyframes pk{0.00%{transform:translateX(0px)}7.00%{transform:translateX(0px)}20.00%{transform:translateX(230px)}27.00%{transform:translateX(230px)}40.00%{transform:translateX(460px)}47.00%{transform:translateX(460px)}60.00%{transform:translateX(690px)}67.00%{transform:translateX(690px)}80.00%{transform:translateX(920px)}87.00%{transform:translateX(920px)}100%{transform:translateX(920px)}}.p0{opacity:0;animation:p0 8.0s steps(1,end) infinite}@keyframes p0{0%{opacity:0}0.00%{opacity:1}20.00%{opacity:0}100%{opacity:0}}.p1{opacity:0;animation:p1 8.0s steps(1,end) infinite}@keyframes p1{0%{opacity:0}20.00%{opacity:1}40.00%{opacity:0}100%{opacity:0}}.p2{opacity:0;animation:p2 8.0s steps(1,end) infinite}@keyframes p2{0%{opacity:0}40.00%{opacity:1}60.00%{opacity:0}100%{opacity:0}}.p3{opacity:0;animation:p3 8.0s steps(1,end) infinite}@keyframes p3{0%{opacity:0}60.00%{opacity:1}80.00%{opacity:0}100%{opacity:0}}.p4{opacity:0;animation:p4 8.0s steps(1,end) infinite}@keyframes p4{0%{opacity:0}80.00%{opacity:1}99.90%{opacity:0}100%{opacity:0}}</style><rect x="0.5" y="0.5" width="1199" height="371" rx="14" fill="#0b0b10" stroke="#2c2c3a"/><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#272734"/></pattern><clipPath id="card"><rect x="1" y="1" width="1198" height="370" rx="13"/></clipPath></defs><rect x="1" y="1" width="1198" height="370" rx="13" fill="url(#dots)" opacity=".55"/><text class="m" x="40" y="46" font-size="13" fill="#9494a0" text-anchor="start" font-weight="700" letter-spacing="2.5">HOW A RACE GETS ON SCREEN</text><text class="m" x="1160" y="46" font-size="13" fill="#5c5c6a" text-anchor="end" font-weight="400" letter-spacing="2.5">PYTHON BACKEND  →  BROWSER</text><rect x="40" y="62" width="1120" height="1" fill="#2c2c3a"/><rect x="140" y="149" width="920" height="2" fill="#444458"/><rect class="prog" x="140" y="149" width="920" height="2" fill="#e10600"/><text class="m" x="140" y="120" font-size="13" fill="#5c5c6a" text-anchor="middle" font-weight="700" letter-spacing="2">01</text><circle class="n0" cx="140" cy="150" r="9" stroke-width="2" fill="#15151e" stroke="#444458"/><text class="s" x="140" y="200" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700" letter-spacing="3">INGEST</text><text class="s" x="140" y="232" font-size="16" fill="#9494a0" text-anchor="middle" font-weight="400">FastF1 timing feeds</text><text class="s" x="140" y="257" font-size="16" fill="#9494a0" text-anchor="middle" font-weight="400">per-driver extraction</text><text class="s" x="140" y="282" font-size="16" fill="#9494a0" text-anchor="middle" font-weight="400">in a 4-process pool</text><text class="m" x="370" y="120" font-size="13" fill="#5c5c6a" text-anchor="middle" font-weight="700" letter-spacing="2">02</text><circle class="n1" cx="370" cy="150" r="9" stroke-width="2" fill="#15151e" stroke="#444458"/><text class="s" x="370" y="200" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700" letter-spacing="3">RESAMPLE</text><text class="s" x="370" y="232" font-size="16" fill="#9494a0" text-anchor="middle" font-weight="400">every channel on one</text><text class="s" x="370" y="257" font-size="16" fill="#9494a0" text-anchor="middle" font-weight="400">25 Hz clock</text><text class="s" x="370" y="282" font-size="16" fill="#9494a0" text-anchor="middle" font-weight="400">positions snapped to</text><text class="s" x="370" y="307" font-size="16" fill="#9494a0" text-anchor="middle" font-weight="400">the centerline (k-d tree)</text><text class="m" x="600" y="120" font-size="13" fill="#5c5c6a" text-anchor="middle" font-weight="700" letter-spacing="2">03</text><circle class="n2" cx="600" cy="150" r="9" stroke-width="2" fill="#15151e" stroke="#444458"/><text class="s" x="600" y="200" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700" letter-spacing="3">PREDICT</text><text class="s" x="600" y="232" font-size="16" fill="#9494a0" text-anchor="middle" font-weight="400">Bayesian tyre model</text><text class="s" x="600" y="257" font-size="16" fill="#9494a0" text-anchor="middle" font-weight="400">overtake odds: LightGBM</text><text class="s" x="600" y="282" font-size="16" fill="#9494a0" text-anchor="middle" font-weight="400">pit window: XGBoost</text><text class="m" x="830" y="120" font-size="13" fill="#5c5c6a" text-anchor="middle" font-weight="700" letter-spacing="2">04</text><circle class="n3" cx="830" cy="150" r="9" stroke-width="2" fill="#15151e" stroke="#444458"/><text class="s" x="830" y="200" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700" letter-spacing="3">STREAM</text><text class="s" x="830" y="232" font-size="16" fill="#9494a0" text-anchor="middle" font-weight="400">F1SC binary chunks</text><text class="s" x="830" y="257" font-size="16" fill="#9494a0" text-anchor="middle" font-weight="400">60 s of frames each</text><text class="s" x="830" y="282" font-size="16" fill="#9494a0" text-anchor="middle" font-weight="400">served by FastAPI</text><text class="m" x="1060" y="120" font-size="13" fill="#5c5c6a" text-anchor="middle" font-weight="700" letter-spacing="2">05</text><circle class="n4" cx="1060" cy="150" r="9" stroke-width="2" fill="#15151e" stroke="#444458"/><text class="s" x="1060" y="200" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700" letter-spacing="3">RENDER</text><text class="s" x="1060" y="232" font-size="16" fill="#9494a0" text-anchor="middle" font-weight="400">zero-allocation sampler</text><text class="s" x="1060" y="257" font-size="16" fill="#9494a0" text-anchor="middle" font-weight="400">PixiJS v8 track canvas</text><text class="s" x="1060" y="282" font-size="16" fill="#9494a0" text-anchor="middle" font-weight="400">uPlot + Dockview panels</text><g class="pk"><circle cx="140" cy="150" r="5" fill="#ffffff"/><g class="p0"><rect x="80" y="86" width="120" height="20" rx="3" fill="#272734"/><text class="m" x="140" y="100" font-size="11" fill="#c4c4cf" text-anchor="middle" font-weight="700" letter-spacing="1">raw feeds</text></g><g class="p1"><rect x="80" y="86" width="120" height="20" rx="3" fill="#272734"/><text class="m" x="140" y="100" font-size="11" fill="#c4c4cf" text-anchor="middle" font-weight="700" letter-spacing="1">25 Hz frames</text></g><g class="p2"><rect x="80" y="86" width="120" height="20" rx="3" fill="#272734"/><text class="m" x="140" y="100" font-size="11" fill="#c4c4cf" text-anchor="middle" font-weight="700" letter-spacing="1">+ predictions</text></g><g class="p3"><rect x="80" y="86" width="120" height="20" rx="3" fill="#272734"/><text class="m" x="140" y="100" font-size="11" fill="#c4c4cf" text-anchor="middle" font-weight="700" letter-spacing="1">F1SC chunk</text></g><g class="p4"><rect x="80" y="86" width="120" height="20" rx="3" fill="#272734"/><text class="m" x="140" y="100" font-size="11" fill="#c4c4cf" text-anchor="middle" font-weight="700" letter-spacing="1">on screen</text></g></g><text class="s" x="40" y="348" font-size="13" fill="#5c5c6a" text-anchor="start" font-weight="400">Raw feeds arrive at different, uneven rates. Everything is put on one clock before it reaches the browser, so the map, tower and charts always agree.</text></svg>
